server:
  port: ${PORT:8080}
spring:
  config.import: optional:file:.env[.properties]
  application.name: resume-vault
  threads.virtual.enabled: true
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/CV-DIVER}
  servlet.multipart:
    max-file-size: 500MB
    max-request-size: 500MB
app:
  storage-dir: ${UPLOAD_DIR:./data/uploads}
  max-documents: ${MAX_DOCUMENTS:70}
  ai-enabled: ${AI_ENABLED:false}
  gemini-api-key: ${GEMINI_API_KEY:}
  gemini-model: ${GEMINI_MODEL:gemini-2.5-flash}
