server:
  port: ${PORT:8080}
spring:
  application.name: resume-vault
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/resumevault;AUTO_SERVER=TRUE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
  servlet.multipart:
    max-file-size: 20MB
    max-request-size: 100MB
app:
  storage-dir: ${UPLOAD_DIR:./data/uploads}
  max-documents: ${MAX_DOCUMENTS:70}
  ai-enabled: ${AI_ENABLED:false}
  openai-api-key: ${OPENAI_API_KEY:}
  openai-model: ${OPENAI_MODEL:gpt-4o-mini}
  tesseract-path: ${TESSERACT_PATH:}
